---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/.github/actions/android"
    schedule:
      interval: "weekly"
  # slatify is a bundled JS action. Dependabot updates package.json and the
  # lockfile but cannot rebuild dist/, so these PRs fail the slatify-build
  # workflow until someone runs `npm run build` and amends the branch.
  - package-ecosystem: "npm"
    directory: "/.github/actions/slatify"
    schedule:
      interval: "weekly"